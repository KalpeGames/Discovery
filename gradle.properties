# Gradle
org.gradle.jvmargs=-Xmx3G
org.gradle.parallel=true
org.gradle.configuration-cache=false
# Gradle itself must run on Java 25 (Loom refuses to set up 26.x on anything older); the 1.21.x
# nodes still compile for Java 21 through their own toolchain. If your default JDK is older, point
# JAVA_HOME at a JDK 25, or set org.gradle.java.home in ~/.gradle/gradle.properties.

# Mod identity (every version)
mod_version=0.1.0
maven_group=cc.serverlist
archives_base_name=serverlist-featured

# Loader: one version to compile against; loader_dep is what fabric.mod.json asks players for.
loader_version=0.19.5
loader_dep=>=0.16.10

# Defaults for the 26.3 node; every node overrides these in versions/<mc>/gradle.properties.
minecraft_version=26.3
minecraft_dep=>=26.3 <26.4
